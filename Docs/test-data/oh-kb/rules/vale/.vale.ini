; Vale Configuration - OpenHarmony
; Generated by Doc Solution Knowledge Builder
; Rules extracted from md-style-check.md (14 rules, 9 categories)

StylesPath = styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = DocsStyle, Custom, OpenHarmony

[DocsStyle]
HeadingHierarchy = YES

[Custom]
Terminology = YES

[OpenHarmony]
; Code quality
NoConsoleLog = YES
; Heading style
HeadingNumbering = YES
; Note/Caution/Warning format
NoteCautionFormat = YES
; HTML tag rules
HtmlTagFormat = YES
; Link detection
AtLinkDetection = YES
LinkUnclosedParen = YES
LinkSpaceInPath = YES
LinkBrTag = YES
; Image restrictions
ImageTypeRestriction = YES
; Table formatting
TableTabChar = YES
TablePipeFormat = YES
TableSeparatorFormat = YES
; Paragraph formatting
TrailingSpaces = YES
BlankLineWhitespace = YES
