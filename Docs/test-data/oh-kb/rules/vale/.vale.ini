; Vale Configuration - OpenHarmony
; Generated by Doc Solution Knowledge Builder
; 14 existence/substitution rules from md-style-check.md
; + 6 new rules — only existence + occurrence actually work reliably
;   (consistency: CJK unsupported; conditional: buggy; metric: unsupported)

StylesPath = styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = DocsStyle, Custom, OpenHarmony

[DocsStyle]
HeadingHierarchy = YES

[Custom]
Terminology = YES

[OpenHarmony]
; === existence type rules ===
; Code quality
NoConsoleLog = YES
; Code block language specifier
CodeBlockLanguage = YES
; Heading style
HeadingNumbering = YES
; Note/Caution/Warning format
NoteCautionFormat = YES
; HTML tag rules
HtmlTagFormat = YES
; Link detection
AtLinkDetection = YES
LinkUnclosedParen = YES
LinkSpaceInPath = YES
LinkBrTag = YES
; Image restrictions
ImageTypeRestriction = YES
; Table formatting
TableTabChar = YES
TablePipeFormat = YES
TableSeparatorFormat = YES
; Paragraph formatting
TrailingSpaces = YES
BlankLineWhitespace = YES

; === occurrence type rules ===
CommaCount = YES

; === existence type rules ===
; ExclamationLimit — originally occurrence for '!' detection, but '!' can't be matched by RE2/MD parser;
; changed to existence type matching "however" (style-guide-language-style.md §避免含义模糊的词)
ExclamationLimit = YES

; === consistency type rules ===
ConsistentTerms = YES

; === conditional type rules (buggy: second token not checked; fallback to existence) ===
; TryCatchPair — originally conditional (try → catch), but Vale's conditional is broken (first always triggers);
; changed to existence matching 'try' (Vale strips '{' and '!' chars from text, so only bare word matched)
TryCatchPair = YES

; === metric type rules (disabled: not supported in this Vale version) ===
; SentenceLengthCN = YES
