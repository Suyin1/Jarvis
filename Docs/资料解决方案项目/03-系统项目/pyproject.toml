[project]
name = "doc-solution"
version = "0.1.0"
description = "资料开发全链路解决方案系统"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.scripts]
doc-solution = "tools.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "tools*", "mcp*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
